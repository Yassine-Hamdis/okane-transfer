<div class="page-container">
  <div class="page-header">
    <h1>Agencies</h1>
    <a mat-flat-button color="primary" routerLink="/admin/agencies/new">
      <mat-icon>add</mat-icon> Add Agency
    </a>
  </div>

  <mat-card>
    <div class="table-filters">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search agencies</mat-label>
        <input matInput (input)="applyFilter($any($event.target).value)" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>
    </div>

    <app-loading-spinner *ngIf="loading" [inline]="true" />

    <div class="table-wrapper" *ngIf="!loading">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let a"><strong>{{ a.name }}</strong></td>
        </ng-container>

        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>City</th>
          <td mat-cell *matCellDef="let a">{{ a.city }}</td>
        </ng-container>

        <ng-container matColumnDef="country">
          <th mat-header-cell *matHeaderCellDef>Country</th>
          <td mat-cell *matCellDef="let a">
            <code class="code-chip">{{ a.countryCode }}</code>
            {{ a.countryName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="manager">
          <th mat-header-cell *matHeaderCellDef>Manager</th>
          <td mat-cell *matCellDef="let a">{{ a.managerName ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="dailyLimit">
          <th mat-header-cell *matHeaderCellDef>Daily Limit</th>
          <td mat-cell *matCellDef="let a">{{ a.dailyLimit | number }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let a">
            <app-status-badge [status]="a.active ? 'ACTIVE' : 'INACTIVE'" />
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let a">
            <a mat-icon-button [routerLink]="['/admin/agencies', a.id]" matTooltip="View">
              <mat-icon>visibility</mat-icon>
            </a>
            <button mat-icon-button *ngIf="a.active" matTooltip="Suspend" (click)="suspend(a)">
              <mat-icon color="warn">pause_circle</mat-icon>
            </button>
            <button mat-icon-button *ngIf="!a.active" matTooltip="Activate" (click)="activate(a)">
              <mat-icon color="primary">play_circle</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25]" showFirstLastButtons />
  </mat-card>
</div>
