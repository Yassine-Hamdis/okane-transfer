# ============================================================
# DATABASE ? MySQL
# ============================================================
db.url=jdbc:mysql://localhost:3306/okanetransfer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=123
db.driver=com.mysql.cj.jdbc.Driver

# ============================================================
# HIBERNATE
# ============================================================
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true

# ============================================================
# CONNECTION POOL ? HikariCP
# ============================================================
hikari.pool.name=OkaneTransferPool
hikari.maximum.pool.size=10
hikari.minimum.idle=2
hikari.connection.timeout=30000
hikari.idle.timeout=600000
hikari.max.lifetime=1800000

# ============================================================
# JWT
# ============================================================
jwt.secret=MySuperSecretJwtKeyForOkaneTransfer2026!hhhh
jwt.access.expiration.ms=3600000
jwt.refresh.expiration.ms=604800000

# ============================================================
# AES ENCRYPTION
# ============================================================
aes.secret.key=/zzLo1Crnl3DL9oqBUgQirfGa0TzttRxxRqTQTXmD7E=

# ============================================================
# Withdrawal Code
# ============================================================
withdrawal.code.length=8
withdrawal.code.validity-hours=48
withdrawal.code.prefix-separator=-

# ============================================================
# BREVO (email + SMS)
# ============================================================
brevo.api.key=YOUR_BREVO_API_KEY_HERE
brevo.sender.email=noreply@okanetransfer.com
brevo.sender.name=OkaneTransfer
brevo.sms.sender=OkaneTransfer

# ============================================================
